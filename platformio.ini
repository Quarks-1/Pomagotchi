[env:adafruit_feather_esp32_v2]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
build_flags = 
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -I src
    -I src/core
    -I src/pet
    -I src/storage
    -I src/ui
    -I src/ui/screens
    -I src/activities
    -I src/hardware
    -I src/system
    -I src/assets
    -I src/animation
lib_deps =
    ZinggJM/GxEPD2@^1.3.9
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit BusIO@^1.14.1
    https://github.com/adafruit/Adafruit_Seesaw.git
    bblanchon/ArduinoJson@^6.21.3
    https://github.com/adafruit/Adafruit_VCNL4020
    https://github.com/adafruit/Adafruit_LC709203F


; Upload the data directory to the ESP32
board_build.filesystem = littlefs
board_build.filesystem_size = 2M

; Uncomment the following line if you need to specify a custom upload port
; upload_port = /dev/ttyUSB0 